on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pyinstaller-build-mac:
    runs-on: macos-latest
    steps:
      - name: Create Executable
        id: create-executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.12.10'
          spec: 'src/phonlab_desktop.py'
          requirements: 'requirements.txt'
          options: --name "Phonlab", --windowed, --additional-hooks-dir=pyinstaller_hooks
      - name: Warm Numba Cache
        run: |
          PHONLAB_WARMUP_ONLY=1 "${{steps.create-executable.outputs.executable_path}}/Phonlab.app/Contents/MacOS/Phonlab"
        shell: bash
      - name: Create Installer
        run: |
          chmod +x ./script/create-phonlab-dmg.sh
          ./script/create-phonlab-dmg.sh ${{steps.create-executable.outputs.executable_path}}/Phonlab.app Phonlab-Installer.dmg
        shell: bash
      - name: (Upload) Executable
        uses: actions/upload-artifact@v4
        with:
          name: Phonlab Mac (Apple Silicon)
          path: Phonlab-Installer.dmg

  pyinstaller-build-mac-intel:
    runs-on: macos-15-intel
    steps:
      - name: Install llvm
        run: |
          brew install llvm@22
          echo "CMAKE_PREFIX_PATH=/usr/local/opt/llvm@22" >> $GITHUB_ENV
      - name: Create Executable
        id: create-executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.12.10'
          spec: 'src/phonlab_desktop.py'
          requirements: 'requirements.txt'
          options: --name "Phonlab", --windowed, --additional-hooks-dir=pyinstaller_hooks
      - name: Warm Numba Cache
        run: |
          PHONLAB_WARMUP_ONLY=1 "${{steps.create-executable.outputs.executable_path}}/Phonlab.app/Contents/MacOS/Phonlab"
        shell: bash
      - name: Create Installer
        run: |
          chmod +x ./script/create-phonlab-dmg.sh
          ./script/create-phonlab-dmg.sh ${{steps.create-executable.outputs.executable_path}}/Phonlab.app Phonlab-Installer.dmg
        shell: bash
      - name: (Upload) Executable
        uses: actions/upload-artifact@v4
        with:
          name: Phonlab Mac (Intel)
          path: Phonlab-Installer.dmg

  pyinstaller-build-windows:
    runs-on: windows-latest
    steps:
      - name: Create Executable
        id: create-executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.12.10'
          spec: 'src/phonlab_desktop.py'
          requirements: 'requirements.txt'
          options: --name "Phonlab", --windowed, --additional-hooks-dir=pyinstaller_hooks
      - name: Warm Numba Cache
        shell: pwsh
        run: |
          $env:PHONLAB_WARMUP_ONLY = "1"
          & "${{steps.create-executable.outputs.executable_path}}\Phonlab\Phonlab.exe"
      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: script/phonlab_inno_script.iss
          options: /O+
      - name: (Upload) Executable
        uses: actions/upload-artifact@v4
        with:
          name: Phonlab Windows
          path: script/Output/Phonlab Installer.exe

  pyinstaller-build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Create Executable
        id: create-executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.12.10'
          spec: 'src/phonlab_desktop.py'
          requirements: 'requirements.txt'
          options: --name "Phonlab", --windowed, --additional-hooks-dir=pyinstaller_hooks
      - name: Warm Numba Cache
        run: |
          PHONLAB_WARMUP_ONLY=1 "${{steps.create-executable.outputs.executable_path}}/Phonlab/Phonlab"
      - name: Create tarball
        run: |
          tar -czvf phonlab.tar.gz  -C ${{steps.create-executable.outputs.executable_path}}/Phonlab .
      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phonlab Debian x64
          path: phonlab.tar.gz
